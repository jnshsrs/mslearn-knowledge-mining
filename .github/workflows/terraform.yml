name: Terraform Deploy

on:
  push:
    branches:
      - cicd
      - upload-data-via-workfow

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository # This should usually come before setting up tools that might act on the repo
      uses: actions/checkout@v3

    - name: Setup Terraform # Consolidated step
      uses: hashicorp/setup-terraform@v3 # Use v3 or a newer stable version
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false 

    - name: Terraform Init
      run: terraform init
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    - name: Terraform Plan
      run: terraform plan
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Show all Terraform outputs (for debugging only)
      run: terraform -chdir=terraform output
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      
    - name: Print Shell
      run: echo $SHELL
      
    - name: Get Terraform Outputs
      id: tf_outputs
      working-directory: ./terraform # Make sure this path is correct
      run: |
        # Use jq -r '.' to decode the JSON string directly
        SA_NAME=$(terraform output -json storage_account_name | jq -r '.')
        CONTAINER_NAME=$(terraform output -json storage_container_name | jq -r '.')
        
        # (Optional but good for debugging) Echo the captured values
        echo "Captured SA Name: '$SA_NAME'"
        echo "Captured Container Name: '$CONTAINER_NAME'"
        
        echo "storage_account=$SA_NAME" >> $GITHUB_OUTPUT
        echo "storage_container=$CONTAINER_NAME" >> $GITHUB_OUTPUT
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Login to Azure CLI
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        enable-AzPSSession: false
    
            # MODIFIED STEP: Upload files to Azure Storage
    - name: Upload files to Azure Storage
      run: |
        # Use the storage account and container names from Terraform outputs
        STORAGE_ACCOUNT_NAME="${{ steps.tf_outputs.outputs.storage_account }}"
        CONTAINER_NAME="${{ steps.tf_outputs.outputs.storage_container }}"
        echo "The current workdir is: $(pwd)"
        echo "List of files in the current directory:"
        ls -alh

        # Define your local source data folder. Adjust if your folder is named 'data' instead of '.data'
        SOURCE_DATA_FOLDER="./Labfiles/01-azure-search/data" 

        echo "Uploading files from '$SOURCE_DATA_FOLDER' to container '$CONTAINER_NAME'..."
        if [ -d "$SOURCE_DATA_FOLDER" ]; then
          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --destination "$CONTAINER_NAME" \ # <--- CORRECTED ARGUMENT HERE
            --source "$SOURCE_DATA_FOLDER" \
            --destination-path "." \         # This specifies the path within the container (e.g., root)
            --overwrite \
            --auth-mode login \
            --output none
          echo "Files uploaded successfully."
        else
          echo "Error: Source folder '$SOURCE_DATA_FOLDER' not found. Nothing to upload."
          # exit 1 
        fi