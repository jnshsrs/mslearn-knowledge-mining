name: Terraform Deploy

on:
  push:
    branches:
      - cicd
      - upload-data-via-workfow

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository # This should usually come before setting up tools that might act on the repo
      uses: actions/checkout@v3

    - name: Setup Terraform # Consolidated step
      uses: hashicorp/setup-terraform@v3 # Use v3 or a newer stable version
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false 

    - name: Terraform Init
      run: terraform init
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    - name: Terraform Plan
      run: terraform plan
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: terraform
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Show all Terraform outputs (for debugging only)
      run: terraform -chdir=terraform output
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      
    - name: Print Shell
      run: echo $SHELL
      
    - name: Get Terraform Outputs
      id: tf_outputs
      working-directory: ./terraform # Make sure this path is correct
      run: |
        # Use jq -r '.' to decode the JSON string directly
        SA_NAME=$(terraform output -json storage_account_name | jq -r '.')
        CONTAINER_NAME=$(terraform output -json storage_container_name | jq -r '.')
        
        # (Optional but good for debugging) Echo the captured values
        echo "Captured SA Name: '$SA_NAME'"
        echo "Captured Container Name: '$CONTAINER_NAME'"
        
        echo "storage_account=$SA_NAME" >> $GITHUB_OUTPUT
        echo "storage_container=$CONTAINER_NAME" >> $GITHUB_OUTPUT
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Login to Azure CLI
      uses: azure/login@v1
      with:
        # creds: ${{ secrets.AZURE_CREDENTIALS }} # Recommended: Store all SP creds as a JSON object secret
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        enable-AzPSSession: false # Set to true if you also need Azure PowerShell

    # NEW STEP: Upload files from .data folder
    - name: Upload files to Azure Storage
      run: |
        echo "Uploading files from ./.data to Storage Account: ${{ steps.tf_outputs.outputs.storage_account }}, Container: ${{ steps.tf_outputs.outputs.storage_container }}"
        
        # Ensure the .data directory exists before trying to upload
        if [ -d "./.data" ]; then
          az storage blob upload-batch \
            --account-name "${{ steps.tf_outputs.outputs.storage_account }}" \
            --container-name "${{ steps.tf_outputs.outputs.storage_container }}" \
            --source "./.data" \
            --destination-path "." \
            --overwrite \
            --auth-mode login # Use the Azure CLI's logged-in identity
        else
          echo "Error: .data directory not found. Nothing to upload."
          # exit 1 # Optionally fail the step if the directory is missing
        fi
      # working-directory: ./ # Set this if your .data folder is not at the root of the checkout